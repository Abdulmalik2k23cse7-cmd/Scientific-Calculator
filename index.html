<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>

<style>
body {
    background: #1e1e2f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

.calculator {
    background: #2c2c3c;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    width: 320px;
}

.display {
    width: 100%;
    height: 60px;
    background: #000;
    color: #0f0;
    text-align: right;
    font-size: 24px;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

button {
    padding: 15px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #444;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #666;
}

.operator {
    background: #ff9500;
}

.operator:hover {
    background: #e08900;
}

.equal {
    background: #28a745;
    grid-column: span 2;
}

.equal:hover {
    background: #218838;
}

.clear {
    background: #dc3545;
}

.clear:hover {
    background: #c82333;
}
</style>

</head>
<body>

<div class="calculator">
    <div class="display">0</div>

    <div class="buttons">
        <button class="clear">C</button>
        <button>(</button>
        <button>)</button>
        <button>%</button>
        <button class="operator">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>√</button>
        <button class="operator">*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>x²</button>
        <button class="operator">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>log</button>
        <button class="operator">+</button>

        <button>0</button>
        <button>.</button>
        <button>sin</button>
        <button>cos</button>
        <button class="equal">=</button>
    </div>
</div>

</body>
</html>
